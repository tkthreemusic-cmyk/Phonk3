name: Build VST3 Plugin

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ninja
        run: |
          choco install ninja -y
          refreshenv

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release

      - name: Find and Package VST3
        shell: pwsh
        run: |
          $vst3Path = Get-ChildItem -Path "build" -Recurse -Filter "*.vst3" -Directory | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "Found VST3: $vst3Path"
          if ($vst3Path) {
            Compress-Archive -Path "$vst3Path\*" -DestinationPath "PhonkSynth-Windows-VST3.zip" -Force
            Write-Host "Created PhonkSynth-Windows-VST3.zip"
            Get-ChildItem "PhonkSynth-Windows-VST3.zip"
          } else {
            Write-Host "ERROR: No VST3 found!"
            exit 1
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhonkSynth-Windows-VST3
          path: PhonkSynth-Windows-VST3.zip
          retention-days: 7

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y cmake libasound2-dev libjack-jackd2-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev libxcomposite-dev libflac-dev libogg-dev libvorbis-dev libpng-dev libfreetype6-dev pkg-config

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --target PhonkSynth_VST3

      - name: Find and Package VST3
        run: |
          VST3_PATH=$(find build -name "*.vst3" -type d 2>/dev/null | head -1)
          echo "Found VST3: $VST3_PATH"
          if [ -n "$VST3_PATH" ]; then
            cd "$VST3_PATH"
            zip -r "$GITHUB_WORKSPACE/PhonkSynth-Linux-VST3.zip" .
            cd -
            ls -la "$GITHUB_WORKSPACE/PhonkSynth-Linux-VST3.zip"
          else
            echo "ERROR: No VST3 found!"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhonkSynth-Linux-VST3
          path: PhonkSynth-Linux-VST3.zip
          retention-days: 7

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          draft: true
